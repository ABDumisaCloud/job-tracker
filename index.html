<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Tracker - Aviwe Dumisa</title>
<style>
body{font-family:Arial, sans-serif;background:#F1F5F9;padding:14px;margin:0;color:#1E293B}
h1{text-align:center;margin:10px 0 0;font-size:26px;color:#0F172A}
p.sub{text-align:center;color:#475569;margin:5px 0 15px;font-size:15px;font-weight:600}
.box{background:#FFFFFF;padding:16px;border-radius:16px;margin-bottom:14px;border:1px solid #CBD5E1}
input,select{width:100%;padding:14px;margin:7px 0;border:1.5px solid #94A3B8;border-radius:12px;font-size:17px;font-weight:600;color:#0F172A;background:#FFFFFF;box-sizing:border-box}
label{font-weight:700;font-size:14px;color:#334155}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:18px;font-weight:700;color:#FFFFFF;background:#2563EB}
.card{background:#FFFFFF;padding:16px;border-radius:16px;margin-bottom:12px;border:1px solid #CBD5E1}
.card b{font-size:20px;color:#0F172A}
.card div{font-size:16px;color:#334155;font-weight:500}
.small{color:#0F172A;font-size:15px;font-weight:700}
.card select{margin-top:10px;background:#EFF6FF;color:#1E40AF;border:1.5px solid #93C5FD;font-weight:700}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1;padding:14px;border:none;border-radius:12px;font-size:17px;font-weight:700;color:#FFFFFF}
.upd{background:#16A34A}
.del{background:#DC2626}
.clear{background:#475569;margin-top:12px;color:#FFFFFF}
.status-label{margin-top:10px;font-size:13px;font-weight:700;color:#475569}
</style>
</head>
<body>
<h1>Job Tracker</h1>
<p class="sub">By Aviwe Dumisa • Eye Friendly</p>

<div class="box">
<label>COMPANY</label>
<input id="company" placeholder="Company e.g. Standard Bank">
<label>ROLE</label>
<input id="role" placeholder="Role e.g. Junior Cloud Engineer">
<label>STATUS</label>
<select id="status">
<option>Applied</option>
<option>Interview</option>
<option>Offer</option>
<option>Rejected</option>
</select>
<button class="btn" onclick="addJob()">+ Add Job</button>
</div>

<div id="list"></div>
<button class="btn clear" onclick="clearAll()">Clear All Jobs</button>

<script>
let jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
function save(){ localStorage.setItem('jobs', JSON.stringify(jobs)); show(); }
function addJob(){
 let c=document.getElementById('company').value.trim();
 let r=document.getElementById('role').value.trim();
 let s=document.getElementById('status').value;
 if(!c || !r){ alert('Please fill Company and Role'); return; }
 jobs.push({company:c, role:r, status:s, date:new Date().toLocaleDateString('en-GB')});
 document.getElementById('company').value='';
 document.getElementById('role').value='';
 save();
}
function delJob(i){ if(confirm('Delete '+jobs[i].company+'?')){ jobs.splice(i,1); save(); } }
function updJob(i){
 let newStatus = document.getElementById('upd'+i).value;
 jobs[i].status = newStatus;
 save();
}
function clearAll(){ if(confirm('Delete ALL jobs?')){ jobs=[]; save(); } }
function show(){
 let html='';
 jobs.forEach((j,i)=>{
 html+=`<div class="card"><b>${j.company}</b><div>${j.role}</div><div class="small">Status: ${j.status} • ${j.date}</div><div class="status-label">Tap to change status, then press Update:</div><select id="upd${i}"><option ${j.status=='Applied'?'selected':''}>Applied</option><option ${j.status=='Interview'?'selected':''}>Interview</option><option ${j.status=='Offer'?'selected':''}>Offer</option><option ${j.status=='Rejected'?'selected':''}>Rejected</option></select><div class="row"><button class="upd" onclick="updJob(${i})">Update</button><button class="del" onclick="delJob(${i})">Delete</button></div></div>`;
 });
 document.getElementById('list').innerHTML=html||'<p style="text-align:center;color:#334155;font-weight:700">No jobs yet. Add one above.</p>';
}
show();
</script>
</body>
</html>
